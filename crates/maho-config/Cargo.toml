[package]
name = "maho-config"
description = "Layered harness configuration (~/.omo/omo.jsonc + project .omo/omo.jsonc): load, validate, merge, write, migrate."
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"

[dependencies]
maho-support = { path = "../maho-support" }
maho-core = { path = "../maho-core" }
maho-ext-api = { path = "../maho-ext-api" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
chrono = { workspace = true, features = ["clock", "std"] }
percent-encoding.workspace = true
regex.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.28.0", features = ["signal", "user", "fs"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
