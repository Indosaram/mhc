[package]
name = "maho-rpc"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"
autotests = false

[dependencies]
async-trait = "=0.1.92"
maho-core = { path = "../maho-core" }
maho-agent = { path = "../maho-agent" }
maho-tools = { path = "../maho-tools" }
maho-ai = { path = "../maho-ai" }
maho-ext-api = { path = "../maho-ext-api" }
maho-tool-child = { path = "../maho-tool-child" }
maho-tui = { path = "../maho-tui" }
chrono = { workspace = true, features = ["std", "clock"] }
rustix = { version = "=1.1.4", features = ["process", "pipe"] }
sha2.workspace = true
hex.workspace = true
libc.workspace = true
uuid = { workspace = true, features = ["v4"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
futures.workspace = true
getrandom = "=0.3.4"
subtle = "=2.6.1"
notify = "=8.2.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
tokio = { workspace = true, features = ["io-util", "io-std", "sync", "rt", "macros", "net", "time", "fs", "signal", "process"] }

# darwin process table, start identity and child listing without a `ps` spawn (safe libproc bindings).
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"

[dev-dependencies]
anyhow = "=1.0.104"
tempfile.workspace = true
maho-ext-host = { path = "../maho-ext-host" }
maho-test-support = { path = "../maho-test-support", features = ["sdk"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
