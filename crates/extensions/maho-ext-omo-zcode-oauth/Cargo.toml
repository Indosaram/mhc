[package]
name = "maho-ext-omo-zcode-oauth"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
maho-ai = { path = "../../maho-ai" }
maho-ext-api = { path = "../../maho-ext-api" }
maho-ext-host = { path = "../../maho-ext-host" }
serde_json = "=1.0.149"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "=1.52.3", features = ["rt", "time", "macros", "sync"] }
uuid = { version = "=1.20.0", features = ["v4"] }
rand = "=0.9.3"
regex = "=1.12.3"
sha2 = "=0.10.9"
hkdf = "=0.12.4"
hmac = "=0.12.1"
aes-gcm = "=0.10.3"
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8"] }
base64 = "=0.22.1"
iana-time-zone = "=0.1.65"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
