[package]
name = "maho-ext-pi-comment-checker"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
maho-ext-api = { path = "../../maho-ext-api" }
maho-comment-checker-core = { path = "../../omo/comment-checker-core" }
serde_json = "=1.0.149"
tokio = { version = "=1.52.3", features = ["process", "io-util", "time", "macros", "rt"] }

[dev-dependencies]
tempfile = "=3.27.0"
maho-ext-host = { path = "../../maho-ext-host" }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.28.0", features = ["signal", "process"] }

[lints]
workspace = true
