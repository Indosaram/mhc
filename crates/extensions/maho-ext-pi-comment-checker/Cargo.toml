[package]
name = "maho-ext-pi-comment-checker"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

# `omo-core` keeps the default (omo) build on the SUL comment-checker-core helpers. Without it the
# extension uses the MIT `maho-comment-checker` crate (MIT profile).
[features]
default = []
omo-core = ["dep:maho-comment-checker-core"]

[dependencies]
maho-ext-api = { path = "../../maho-ext-api" }
maho-comment-checker = { path = "../../maho-comment-checker" }
# SUL (crates/omo); only the `omo-core` feature (enabled by maho-cli `omo`) links it.
maho-comment-checker-core = { path = "../../omo/comment-checker-core", optional = true }
serde_json = "=1.0.149"
tokio = { version = "=1.52.3", features = ["process", "io-util", "time", "macros", "rt"] }

[dev-dependencies]
tempfile = "=3.27.0"
maho-ext-host = { path = "../../maho-ext-host" }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.28.0", features = ["signal", "process"] }

[lints]
workspace = true

[[example]]
name = "host_fixture"
test = true
