[package]
name = "maho-ext-permission-system"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"
autotests = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }
maho-ext-api = { path = "../../maho-ext-api" }
maho-core = { path = "../../maho-core" }
maho-ext-gpt-apply-patch = { path = "../maho-ext-gpt-apply-patch" }
maho-ext-imagegen = { path = "../maho-ext-imagegen" }
maho-tools = { path = "../../maho-tools" }
unicode-normalization = "=0.1.25"
regex.workspace = true
url.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
maho-ext-host = { path = "../../maho-ext-host" }
maho-ai = { path = "../../maho-ai" }
maho-agent = { path = "../../maho-agent" }
maho-test-support = { path = "../../maho-test-support", features = ["sdk"] }
tokio = { workspace = true, features = ["sync", "macros", "rt"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
