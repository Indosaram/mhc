[package]
name = "maho-ext-todotools"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"
autotests = false

[dependencies]
maho-ai = { path = "../../maho-ai" }
maho-core = { path = "../../maho-core" }
maho-ext-api = { path = "../../maho-ext-api" }
maho-tools = { path = "../../maho-tools" }
maho-tui = { path = "../../maho-tui" }
maho-interactive = { path = "../../maho-interactive" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
regex = "=1.12.3"
tokio = { workspace = true, features = ["fs", "macros", "rt"] }

[dev-dependencies]
maho-ext-host = { path = "../../maho-ext-host" }
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
