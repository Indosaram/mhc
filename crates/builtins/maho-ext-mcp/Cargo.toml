[package]
name = "maho-ext-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
thiserror = "=2.0.18"
sha2 = "=0.10.9"
sha1 = "=0.10.6"
regex = "=1.12.3"
tokio = { version = "=1.52.3", features = ["full", "test-util"] }
maho-ext-api = { path = "../../maho-ext-api" }
maho-core = { path = "../../maho-core" }
serde_path_to_error = "=0.1.20"
tempfile = "=3.27.0"
getrandom = "=0.4.2"
base64 = "=0.22.1"
url = "=2.5.8"
globset = "=0.4.20"
axum = "=0.8.9"
fancy-regex.workspace = true
chrono = { workspace = true, features = ["clock"] }
reqwest = { workspace = true, features = ["rustls-tls", "json", "stream"] }
futures = "=0.3.34"
icu_collator = "=2.3.1"

[dev-dependencies]
tempfile = "=3.27.0"
reqwest = { workspace = true, features = ["rustls-tls"] }
maho-test-support = { path = "../../maho-test-support", features = ["sdk"] }
maho-ext-host = { path = "../../maho-ext-host" }
maho-ai = { path = "../../maho-ai" }

[lints]
workspace = true
