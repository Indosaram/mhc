[package]
name = "maho-ext-cursor-cli-oauth"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
maho-ai = { path = "../../maho-ai" }
maho-ext-api = { path = "../../maho-ext-api" }
maho-core = { path = "../../maho-core" }
anyhow = "=1.0.104"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
chrono = { version = "=0.4.43", default-features = false, features = ["std"] }
regex = "=1.12.3"
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
tokio = { version = "=1.52.3", features = ["process", "time", "io-util", "sync", "rt", "macros"] }
nix = { version = "=0.28.0", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
