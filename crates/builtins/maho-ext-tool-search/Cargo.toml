[package]
name = "maho-ext-tool-search"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
maho-ext-api = { path = "../../maho-ext-api" }
maho-tools = { path = "../../maho-tools" }
maho-tui = { path = "../../maho-tui" }
maho-interactive = { path = "../../maho-interactive" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
icu_collator = "=2.3.1"
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "=1.52.3", features = ["macros", "rt", "time"] }
maho-ai = { path = "../../maho-ai" }
maho-ext-host = { path = "../../maho-ext-host" }
maho-test-support = { path = "../../maho-test-support", features = ["sdk"] }
