[package]
name = "maho-ext-terminal"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
sha2 = "=0.10.9"
fancy-regex = "=0.16.2"
serde_json = "=1.0.149"
serde = { version = "=1.0.228", features = ["derive"] }
regex = "=1.12.3"
maho-ai = { path = "../../maho-ai" }
maho-tools = { path = "../../maho-tools" }
maho-ext-api = { path = "../../maho-ext-api" }
maho-core = { path = "../../maho-core" }
maho-pty = { path = "../../vendor/maho-pty" }
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.28.0", features = ["signal", "process"] }

[lints]
workspace = true
