[package]
name = "maho-ext-terminal"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"
autotests = false

[dependencies]
sha2 = "=0.10.9"
indexmap = "=2.14.0"
fancy-regex = "=0.16.2"
serde_json = "=1.0.149"
serde = { version = "=1.0.228", features = ["derive"] }
regex = "=1.12.3"
vt100 = "=0.16.2"
maho-ai = { path = "../../maho-ai" }
maho-tools = { path = "../../maho-tools" }
maho-ext-api = { path = "../../maho-ext-api" }
maho-tool-child = { path = "../../maho-tool-child" }
maho-tui = { path = "../../maho-tui" }
maho-core = { path = "../../maho-core" }
maho-rpc = { path = "../../maho-rpc" }
maho-pty = { path = "../../vendor/maho-pty" }
maho-ext-host = { path = "../../maho-ext-host" }
notify = "=8.2.0"
thiserror = "=2.0.20"
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
maho-test-support = { path = "../../maho-test-support", features = ["sdk"] }
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { version = "=0.28.0", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"

[[test]]
name = "integration"
path = "tests/main.rs"
