[package]
name = "maho-ext-gpt-apply-patch"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
maho-ext-api = { path = "../../maho-ext-api" }
maho-tools = { path = "../../maho-tools" }
maho-ai = { path = "../../maho-ai" }
maho-tui = { path = "../../maho-tui" }
maho-interactive = { path = "../../maho-interactive" }
tokio = { version = "=1.52.3", features = ["fs", "macros", "rt"] }
regex = "=1.12.3"
icu_collator = "=2.3.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
maho-ext-host = { path = "../../maho-ext-host" }
maho-test-support = { path = "../../maho-test-support", features = ["sdk"] }
