[package]
name = "maho-ext-video-in"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"
autotests = false

[dependencies]
maho-ext-api = { path = "../../maho-ext-api" }
maho-ai = { path = "../../maho-ai" }
maho-tools = { path = "../../maho-tools" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt"] }
base64 = "=0.22.1"

[dev-dependencies]
tempfile.workspace = true
maho-core = { path = "../../maho-core" }
maho-agent = { path = "../../maho-agent" }
maho-ext-host = { path = "../../maho-ext-host" }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
