[package]
name = "maho-ext-anthropic-subscription"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
maho-ai = { path = "../../maho-ai" }
maho-ext-api = { path = "../../maho-ext-api" }
maho-ext-builtin-loose = { path = "../maho-ext-builtin-loose" }
anyhow = "=1.0.104"
async-trait = "=0.1.92"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
chrono = { version = "=0.4.43", default-features = false, features = ["std"] }
regex = "=1.12.3"
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
tokio = { version = "=1.52.3", features = ["sync", "process", "time", "io-util", "rt", "macros"] }
tempfile = "=3.27.0"
dirs = "=6.0.0"
unicode-normalization = "=0.1.25"

[dev-dependencies]
maho-ext-host = { path = "../../maho-ext-host" }
maho-test-support = { path = "../../maho-test-support", features = ["sdk"] }
tokio = { version = "=1.52.3", features = ["macros", "rt", "sync"] }

[lints]
workspace = true
