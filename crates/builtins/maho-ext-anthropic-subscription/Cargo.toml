[package]
name = "maho-ext-anthropic-subscription"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
maho-ai = { path = "../../maho-ai" }
anyhow = "=1.0.104"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
chrono = { version = "=0.4.43", default-features = false, features = ["std"] }
regex = "=1.12.3"
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
tokio = { version = "=1.52.3", features = ["sync"] }
tempfile = "=3.27.0"

[dev-dependencies]
tokio = { version = "=1.52.3", features = ["macros", "rt", "sync"] }

[lints]
workspace = true
