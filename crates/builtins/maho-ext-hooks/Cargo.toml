[package]
name = "maho-ext-hooks"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

# `claude-plugins` discovers installed Claude Code plugins' hooks through the SUL
# `claude-code-compat-core` crate (crates/omo). maho-cli's MIT profile builds without it.
[features]
default = ["claude-plugins"]
claude-plugins = ["dep:claude-code-compat-core"]

[dependencies]
claude-code-compat-core = { path = "../../omo/claude-code-compat-core", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
sha2 = "=0.10.9"
thiserror = "=2.0.20"
fancy-regex = "=0.16.2"
regex = "=1.12.3"
maho-core = { path = "../../maho-core" }
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["process", "io-util", "time", "macros", "rt-multi-thread"] }
maho-tools = { path = "../../maho-tools" }
futures = "=0.3.34"
maho-ext-api = { path = "../../maho-ext-api" }
maho-ext-ask-user = { path = "../maho-ext-ask-user" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
maho-test-support = { path = "../../maho-test-support", features = ["sdk"] }
maho-ext-host = { path = "../../maho-ext-host" }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.28.0", features = ["signal", "process"] }

[lints]
workspace = true
