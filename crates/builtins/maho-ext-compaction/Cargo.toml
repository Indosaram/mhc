[package]
name = "maho-ext-compaction"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
maho-ai = { path = "../../maho-ai" }
maho-core = { path = "../../maho-core" }
maho-ext-api = { path = "../../maho-ext-api" }
serde_json = "=1.0.149"
sha2.workspace = true
url.workspace = true
tokio = { version = "=1.52.3", features = ["macros", "time"] }
chrono = { workspace = true, features = ["clock"] }
reqwest.workspace = true
unicode-normalization = "=0.1.25"
icu_collator = "=2.3.1"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
maho-test-support = { path = "../../maho-test-support", features = ["sdk"] }
maho-agent = { path = "../../maho-agent" }
maho-ext-host = { path = "../../maho-ext-host" }
tokio = { version = "=1.52.3", features = ["macros", "rt", "test-util"] }
tempfile.workspace = true

[lints]
workspace = true
