[package]
name = "maho-ext-kill-guard"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"
autotests = false

[dependencies]
serde_json = "=1.0.149"
maho-ext-api = { path = "../../maho-ext-api" }
maho-core = { path = "../../maho-core" }

[dev-dependencies]
maho-test-support = { path = "../../maho-test-support", features = ["sdk"] }
tempfile = { workspace = true }
tokio = { version = "=1.52.3", features = ["rt", "macros", "time"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
