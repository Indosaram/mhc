[package]
name = "maho-ext-goal"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
uuid = { version = "=1.20.0", features = ["v4"] }
maho-core = { path = "../../maho-core" }
maho-ext-api = { path = "../../maho-ext-api" }
maho-agent = { path = "../../maho-agent" }
maho-ai = { path = "../../maho-ai" }
regex = "=1.12.3"
sha2 = "=0.10.9"
chrono = { version = "=0.4.43", default-features = false, features = ["alloc"] }
tokio = { version = "=1.52.3", features = ["rt", "macros", "time"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
