[package]
name = "maho-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"
autotests = false

# `omo` links the oh-my-openagent port under crates/omo/** (LicenseRef-SUL-1.0) and the maho-cli
# modules that host it. It is on by default so the shipped binary keeps every feature; the MIT
# profile is `--no-default-features`, which links no crate under crates/omo/** (docs/MIT-PROFILE.md;
# enforced by the `mit-profile` CI job).
[features]
default = ["omo"]
omo = [
    "dep:maho-omo",
    "dep:maho-omo-task",
    "dep:maho-omo-config-resolution",
    "dep:maho-omo-config-core",
    "dep:maho-omo-memory",
    "dep:maho-omo-telemetry",
    "dep:maho-omo-lsp",
    "dep:ulw-loop-core",
    "dep:memory-core",
    "dep:lsp-daemon",
    "dep:senpi-task",
    "dep:delegate-core",
    "maho-ext-pi-comment-checker/omo-core",
    "maho-ext-hooks/claude-plugins",
]

[dependencies]
maho-chord = { path = "../maho-chord" }
maho-ai = { path = "../maho-ai" }
maho-agent = { path = "../maho-agent" }
maho-core = { path = "../maho-core" }
maho-process-env = { path = "../maho-process-env" }
maho-tui = { path = "../maho-tui" }
maho-tools = { path = "../maho-tools" }
maho-interactive = { path = "../maho-interactive" }
maho-rpc = { path = "../maho-rpc" }
maho-tool-child = { path = "../maho-tool-child" }
maho-ext-api = { path = "../maho-ext-api" }
maho-codemode = { path = "../maho-codemode" }
maho-ext-gpt-apply-patch = { path = "../builtins/maho-ext-gpt-apply-patch" }
maho-ext-tool-search = { path = "../builtins/maho-ext-tool-search" }
maho-ext-todotools = { path = "../builtins/maho-ext-todotools" }
maho-ext-websearch = { path = "../builtins/maho-ext-websearch" }
maho-ext-look-at = { path = "../builtins/maho-ext-look-at" }
maho-ext-help = { path = "../builtins/maho-ext-help" }
maho-ext-history-search = { path = "../builtins/maho-ext-history-search" }
maho-ext-model-fallback = { path = "../builtins/maho-ext-model-fallback" }
maho-ext-account = { path = "../builtins/maho-ext-account" }
maho-ext-builtin-loose = { path = "../builtins/maho-ext-builtin-loose" }
maho-ext-reasoning = { path = "../builtins/maho-ext-reasoning" }
maho-ext-ask-user = { path = "../builtins/maho-ext-ask-user" }
maho-ext-video-in = { path = "../builtins/maho-ext-video-in" }
maho-ext-anthropic-web-search = { path = "../builtins/maho-ext-anthropic-web-search" }
maho-ext-openai-web-search = { path = "../builtins/maho-ext-openai-web-search" }
maho-ext-imagegen = { path = "../builtins/maho-ext-imagegen" }
maho-ext-openai-image-gen = { path = "../builtins/maho-ext-openai-image-gen" }
maho-ext-herdr = { path = "../builtins/maho-ext-herdr" }
maho-ext-btw = { path = "../builtins/maho-ext-btw" }
maho-ext-llama = { path = "../builtins/maho-ext-llama" }
maho-ext-cache-keepalive = { path = "../builtins/maho-ext-cache-keepalive" }
maho-ext-handoff-hint = { path = "../builtins/maho-ext-handoff-hint" }
maho-ext-webfetch = { path = "../builtins/maho-ext-webfetch" }
maho-ext-goal = { path = "../builtins/maho-ext-goal" }
maho-ext-rules = { path = "../builtins/maho-ext-rules" }
maho-ext-compaction = { path = "../builtins/maho-ext-compaction" }
maho-ext-host = { path = "../maho-ext-host" }
maho-ext-mcp = { path = "../builtins/maho-ext-mcp" }
maho-ext-permission-system = { path = "../builtins/maho-ext-permission-system" }
maho-ext-recommended-models = { path = "../builtins/maho-ext-recommended-models" }
maho-config = { path = "../maho-config" }
maho-model-select = { path = "../maho-model-select" }
# MIT LSP client/tools; mounted as `<builtin:lsp>` in the MIT profile only (the omo build mounts its own).
maho-lsp = { path = "../maho-lsp", features = ["extension"] }
# MIT subagent delegation; mounted as `<builtin:task>` in the MIT profile only (the omo build mounts its own).
maho-task = { path = "../maho-task" }
# MIT long-term memory (mnemopi port); mounted as `<builtin:memory>` and served by `mhc memory` in the MIT profile only.
maho-memory = { path = "../maho-memory" }
maho-omo-task = { path = "../omo/components/maho-omo-task", optional = true }
maho-server = { path = "../maho-server" }
maho-ext-loop-guard = { path = "../builtins/maho-ext-loop-guard" }
maho-ext-hooks = { path = "../builtins/maho-ext-hooks", default-features = false }
maho-ext-prompt-preset = { path = "../builtins/maho-ext-prompt-preset" }
maho-ext-anthropic-bash = { path = "../builtins/maho-ext-anthropic-bash" }
maho-ext-bash-timeout = { path = "../builtins/maho-ext-bash-timeout" }
maho-ext-terminal = { path = "../builtins/maho-ext-terminal" }
maho-ext-tool-pair-guard = { path = "../builtins/maho-ext-tool-pair-guard" }
maho-ext-nested-agents-md = { path = "../builtins/maho-ext-nested-agents-md" }
maho-ext-loop = { path = "../builtins/maho-ext-loop" }
maho-ext-ttsr = { path = "../builtins/maho-ext-ttsr" }
maho-ext-config-reload = { path = "../builtins/maho-ext-config-reload" }
maho-ext-pi-webfetch = { path = "../extensions/maho-ext-pi-webfetch" }
maho-ext-pi-rules = { path = "../extensions/maho-ext-pi-rules" }
maho-ext-pi-websearch = { path = "../extensions/maho-ext-pi-websearch" }
maho-ext-pi-goal = { path = "../extensions/maho-ext-pi-goal" }
maho-ext-pi-comment-checker = { path = "../extensions/maho-ext-pi-comment-checker" }
maho-ext-pi-ast-grep = { path = "../extensions/maho-ext-pi-ast-grep" }
maho-ext-pi-nested-agents-md = { path = "../extensions/maho-ext-pi-nested-agents-md" }
maho-ext-omo-zcode-oauth = { path = "../extensions/maho-ext-omo-zcode-oauth" }
maho-ext-orca-prefill = { path = "../extensions/maho-ext-orca-prefill" }
maho-ext-ferryx-agent-state = { path = "../extensions/maho-ext-ferryx-agent-state" }
maho-ext-herdr-agent-state = { path = "../extensions/maho-ext-herdr-agent-state" }
maho-ext-orca-agent-status = { path = "../extensions/maho-ext-orca-agent-status" }
maho-ext-orca-titlebar-spinner = { path = "../extensions/maho-ext-orca-titlebar-spinner" }
maho-omo = { path = "../omo/maho-omo", optional = true }
ulw-loop-core = { path = "../omo/ulw-loop-core", optional = true }
maho-omo-config-resolution = { path = "../omo/components/maho-omo-config-resolution", optional = true }
maho-omo-config-core = { path = "../omo/omo-config-core", optional = true }
maho-omo-memory = { path = "../omo/components/maho-omo-memory", optional = true }
maho-omo-telemetry = { path = "../omo/components/maho-omo-telemetry", optional = true }
memory-core = { package = "maho-memory-core", path = "../omo/memory-core", optional = true }
maho-omo-lsp = { path = "../omo/components/maho-omo-lsp", optional = true }
lsp-daemon = { package = "maho-lsp-daemon", path = "../omo/lsp-daemon", optional = true }
senpi-task = { package = "maho-senpi-task", path = "../omo/senpi-task", optional = true }
delegate-core = { package = "maho-delegate-core", path = "../omo/delegate-core", optional = true }
indexmap.workspace = true
maho-ext-anthropic-subscription = { path = "../builtins/maho-ext-anthropic-subscription" }
maho-ext-cursor-cli-oauth = { path = "../builtins/maho-ext-cursor-cli-oauth" }
async-trait = "=0.1.92"
anyhow = "=1.0.104"
crossterm = "=0.29.0"
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
regex.workspace = true
sha2.workspace = true
flate2 = "=1.1.8"
tar = "0.4"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
url.workspace = true
percent-encoding.workspace = true
base64 = "=0.22.1"
reqwest = { workspace = true, features = ["rustls-tls"] }
semver = "=1.0.27"
minisign-verify = "=0.2.5"
icu_collator = "=2.3.1"
photon-rs = { version = "=0.3.3", default-features = false }
tempfile.workspace = true
notify = "=8.2.0"
nix = { version = "=0.28.0", features = ["signal", "process"] }
tokio = { workspace = true, features = ["time", "macros", "rt", "process", "io-util", "io-std", "fs", "signal", "sync"] }

[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["psapi"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"

[dev-dependencies]
minisign = "=0.7.9"
maho-ext-host = { path = "../maho-ext-host" }
maho-test-support = { path = "../maho-test-support", features = ["sdk"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "mhc"
path = "src/main.rs"

[[bin]]
name = "mhc-launcher"
path = "src/bin/mhc_launcher.rs"

[[bin]]
name = "mhc-update-probe"
path = "src/bin/mhc_update_probe.rs"

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
