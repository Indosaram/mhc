anyhow = "=1.0.104"
crossterm = "=0.29.0"
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
regex.workspace = true
sha2.workspace = true
url.workspace = true
percent-encoding.workspace = true
base64 = "=0.22.1"
reqwest = { workspace = true, features = ["rustls-tls"] }
semver = "=1.0.27"
photon-rs = { version = "=0.3.3", default-features = false }
tempfile.workspace = true
notify = "=8.2.0"
nix = { version = "=0.28.0", features = ["signal", "process"] }
tokio = { workspace = true, features = ["time", "macros", "rt", "process", "io-util", "io-std", "fs", "signal", "sync"] }

[dev-dependencies]
maho-ext-host = { path = "../maho-ext-host" }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "mhc"
path = "src/main.rs"

[lints]
workspace = true
