[package]
name = "maho-lsp"
description = "Language Server Protocol client, server pool, LSP tools, post-mutation hook interfaces and the mhc-lsp mux daemon."
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"

[features]
default = []
# Agent tools, `/lsp` command and post-edit diagnostics hook on the maho extension API.
extension = ["dep:maho-ext-api"]

[dependencies]
maho-ext-api = { path = "../maho-ext-api", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "process", "io-util", "time", "sync", "net"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.28.0", features = ["signal", "user"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[bin]]
name = "mhc-lsp"
path = "src/bin/mhc-lsp.rs"

[lints]
workspace = true
