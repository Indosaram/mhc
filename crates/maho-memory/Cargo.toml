[package]
name = "maho-memory"
description = "Long-term agent memory on SQLite (port of the MIT mnemopi engine): store, lexical recall, retain/recall tools with first-turn auto-recall, a stdio MCP server, and an importer for the legacy Markdown memory store."
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"

[dependencies]
maho-config = { path = "../maho-config" }
maho-ext-api = { path = "../maho-ext-api" }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
sha1 = "=0.10.6"
chrono = { workspace = true, features = ["clock", "std"] }
unicode-normalization.workspace = true
unicode-general-category.workspace = true

# Process liveness for stale-lock recovery: `kill(pid, 0)` on unix and `OpenProcess` on Windows.
# Both are safe wrappers, so this crate keeps the workspace's `unsafe_code = "forbid"`.
[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
