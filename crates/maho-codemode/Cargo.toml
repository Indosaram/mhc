[package]
name = "maho-codemode"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
maho-ext-api = { path = "../maho-ext-api" }
tokio = { version = "=1.52.3", features = ["full", "test-util"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
sha2 = "=0.10.9"
uuid = { version = "=1.20.0", features = ["v4"] }
base64 = "=0.22.1"
getrandom = "=0.4.2"
regex = "=1.12.3"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
