[package]
name = "maho-codemode"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
maho-ext-api = { path = "../maho-ext-api" }
maho-ai = { path = "../maho-ai" }
maho-tools = { path = "../maho-tools" }
maho-tui = { path = "../maho-tui" }
tokio = { version = "=1.52.3", features = ["full", "test-util"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
sha2 = "=0.10.9"
uuid = { version = "=1.20.0", features = ["v4"] }
base64 = "=0.22.1"
getrandom = "=0.4.2"
regex = "=1.12.3"
bytes = "=1.12.1"
hyper = { version = "=1.8.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.3"
tree-sitter = "=0.25.10"
tree-sitter-typescript = "=0.23.2"
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
