[package]
name = "maho-git-bash"
description = "Git Bash command runner for mhc on native Windows, served over stdio MCP by the mhc-git-bash sibling binary (tools run, which_bash, diagnose), plus the extension that declares it on the MCP client."
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"

[dependencies]
maho-ext-api = { path = "../maho-ext-api" }
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util", "io-std", "process", "time"] }

[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "process", "time", "test-util"] }

[[bin]]
name = "mhc-git-bash"
path = "src/bin/mhc-git-bash.rs"

[lints]
workspace = true
