[package]
name = "maho-senpi-desktop-protocol"
version.workspace = true
edition = "2021"
license = "MIT"
autotests = false

[lib]
name = "senpi_desktop_protocol"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
schemars = "=1.2.2"
senpi-desktop-core = { package = "maho-senpi-desktop-core", path = "../senpi-desktop-core" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
