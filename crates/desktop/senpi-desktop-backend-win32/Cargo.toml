[package]
name = "maho-senpi-desktop-backend-win32"
version.workspace = true
edition = "2021"
license = "MIT"

[lib]
name = "senpi_desktop_backend_win32"
crate-type = ["rlib"]

# The background-delivery matrix, the key vocabulary, the held-state ledger,
# and the stop-chord mapping are pure and tested on every host.
[dependencies]
senpi-desktop-core = { package = "maho-senpi-desktop-core", path = "../senpi-desktop-core" }
senpi-desktop-safety = { package = "maho-senpi-desktop-safety", path = "../senpi-desktop-safety" }

[target.'cfg(target_os = "windows")'.dependencies]
senpi-desktop-core = { package = "maho-senpi-desktop-core", path = "../senpi-desktop-core", features = ["system-clipboard"] }
enigo = { version = "=0.6.1", default-features = false }
image = { version = "=0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
parking_lot = "=0.12.5"
uiautomation = "=0.25.1"
windows-sys = { version = "=0.61.2", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
xcap = { version = "=0.9.6", default-features = false }

# Host tests exercise native INPUT recovery; Windows probes also register a class.
[dev-dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
