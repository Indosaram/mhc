[package]
name = "maho-senpi-desktop-session"
version.workspace = true
edition = "2021"
license = "MIT"
autotests = false

[lib]
name = "senpi_desktop_session"
crate-type = ["rlib"]

[dependencies]
flume = "=0.12.0"
image = { version = "=0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
parking_lot = "=0.12.5"
senpi-desktop-backend-fake = { package = "maho-senpi-desktop-backend-fake", path = "../senpi-desktop-backend-fake" }
senpi-desktop-core = { package = "maho-senpi-desktop-core", path = "../senpi-desktop-core" }
senpi-desktop-safety = { package = "maho-senpi-desktop-safety", path = "../senpi-desktop-safety" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
ulid = "=3.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
senpi-desktop-backend-macos = { package = "maho-senpi-desktop-backend-macos", path = "../senpi-desktop-backend-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
senpi-desktop-backend-wayland = { package = "maho-senpi-desktop-backend-wayland", path = "../senpi-desktop-backend-wayland" }
senpi-desktop-backend-x11 = { package = "maho-senpi-desktop-backend-x11", path = "../senpi-desktop-backend-x11" }

[target.'cfg(target_os = "windows")'.dependencies]
senpi-desktop-backend-win32 = { package = "maho-senpi-desktop-backend-win32", path = "../senpi-desktop-backend-win32" }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[[test]]
name = "integration"
path = "tests/main.rs"
