[package]
name = "maho-senpi-desktop-prelude"
version.workspace = true
edition = "2021"
license = "LicenseRef-SUL-1.0"
autotests = false

[lib]
name = "senpi_desktop_prelude"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
schemars = "=1.2.2"
senpi-desktop-protocol = { package = "maho-senpi-desktop-protocol", path = "../senpi-desktop-protocol" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true

[dev-dependencies]
sha2.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
