[package]
name = "maho-senpi-desktop-tool"
version.workspace = true
edition.workspace = true
license = "MIT"
autotests = false

[lib]
name = "senpi_desktop_tool"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
chrono = { workspace = true }
maho-ai = { version = "=0.0.0", path = "../../maho-ai" }
maho-codemode = { version = "=0.0.0", path = "../../maho-codemode" }
maho-ext-api = { version = "=0.0.0", path = "../../maho-ext-api" }
maho-tools = { version = "=0.0.0", path = "../../maho-tools" }
schemars = "=1.2.2"
senpi-desktop-core = { package = "maho-senpi-desktop-core", path = "../senpi-desktop-core" }
senpi-desktop-prelude = { package = "maho-senpi-desktop-prelude", path = "../senpi-desktop-prelude" }
senpi-desktop-protocol = { package = "maho-senpi-desktop-protocol", path = "../senpi-desktop-protocol" }
senpi-desktop-run = { package = "maho-senpi-desktop-run", path = "../senpi-desktop-run" }
senpi-desktop-service = { package = "maho-senpi-desktop-service", path = "../senpi-desktop-service" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"

[[test]]
name = "integration"
path = "tests/main.rs"
