[package]
name = "maho-senpi-task"
version.workspace = true
edition.workspace = true
license = "LicenseRef-SUL-1.0"
publish.workspace = true

[lib]
name = "senpi_task"
path = "src/lib.rs"

[dependencies]
maho-delegate-core.workspace = true
maho-omo-config-core.workspace = true
maho-model-core.workspace = true
maho-utils.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
# Versions match entries already present in the workspace Cargo.lock.
chrono = { workspace = true, features = ["default"] }
fancy-regex.workspace = true
libc.workspace = true
regex.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-width.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true

# Imported from COMP 93b78ac: this crate does not opt into `[lints] workspace = true`.
# The table mirrors the workspace lints; "allow" entries are the lints it trips (todo 2 allow list).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
