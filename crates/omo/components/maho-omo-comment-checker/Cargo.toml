[package]
name = "maho-omo-comment-checker"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "LicenseRef-SUL-1.0"
autotests = false

[dependencies]
maho-ext-api = { path = "../../../maho-ext-api" }
maho-comment-checker-core = { path = "../../comment-checker-core" }
maho-utils = { path = "../../utils" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde_json = "=1.0.149"
tokio = { version = "=1.52.3", features = ["process", "io-util", "fs", "sync"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["process"] }

[dev-dependencies]
maho-test-support = { path = "../../../maho-test-support", features = ["sdk"] }
maho-ext-host = { path = "../../../maho-ext-host" }
tokio = { version = "=1.52.3", features = ["macros", "rt"] }
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
