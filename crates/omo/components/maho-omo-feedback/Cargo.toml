[package]
name = "maho-omo-feedback"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "LicenseRef-SUL-1.0"
description = "Native port of the omo-senpi feedback component (/feedback, /bug, omo.feedback.* RPCs)"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["std", "clock"] }
dirs = { workspace = true }
gethostname = { workspace = true }
maho-ext-api = { path = "../../../maho-ext-api" }
maho-omo-agent-home = { path = "../maho-omo-agent-home" }
maho-omo-config-core = { path = "../../omo-config-core" }
maho-omo-config-resolution = { path = "../maho-omo-config-resolution" }
maho-omo-telemetry = { path = "../maho-omo-telemetry" }
maho-telemetry-core = { path = "../../telemetry-core" }
regex = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["macros", "rt", "sync"] }
