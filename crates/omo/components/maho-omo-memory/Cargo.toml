[package]
name = "maho-omo-memory"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "LicenseRef-SUL-1.0"

[dependencies]
maho-memory-core.workspace = true
maho-ext-api = { path = "../../../maho-ext-api", version = "=0.0.0" }
maho-tools = { path = "../../../maho-tools", version = "=0.0.0" }
maho-omo-config-core = { path = "../../omo-config-core", version = "=0.0.0" }
maho-senpi-task = { path = "../../senpi-task", version = "=0.0.0" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = { workspace = true, features = ["std"] }
notify = "=8.2.0"
tokio = { version = "=1.52.3", features = ["macros", "rt", "time", "process"] }

[dev-dependencies]
maho-rpc = { path = "../../../maho-rpc", version = "=0.0.0" }
maho-test-support = { path = "../../../maho-test-support", features = ["sdk"] }
maho-ext-host = { path = "../../../maho-ext-host" }
maho-ai = { path = "../../../maho-ai" }
tempfile.workspace = true
tokio = { version = "=1.52.3", features = ["macros", "rt", "time", "test-util"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.28.0", features = ["signal", "process"] }
