[package]
name = "maho-omo-ultrawork"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "LicenseRef-SUL-1.0"
autotests = false

[dependencies]
maho-ai = { path = "../../../maho-ai" }
maho-ext-api = { path = "../../../maho-ext-api" }
