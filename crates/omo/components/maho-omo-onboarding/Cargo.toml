[package]
name = "maho-omo-onboarding"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "LicenseRef-SUL-1.0"
autotests = false

[dependencies]
maho-ai = { path = "../../../maho-ai" }
maho-core = { path = "../../../maho-core" }
maho-ext-api = { path = "../../../maho-ext-api" }
maho-tools = { path = "../../../maho-tools" }
maho-memory-core = { path = "../../memory-core" }
maho-omo-start-work-continuation = { path = "../maho-omo-start-work-continuation" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.52.3", features = ["rt", "sync", "time"] }
uuid = { version = "=1.20.0", features = ["v4"] }
jiff = "=0.2.23"

[dev-dependencies]
maho-test-support = { path = "../../../maho-test-support", features = ["sdk"] }
maho-ext-host = { path = "../../../maho-ext-host" }
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["macros", "rt", "process", "io-util", "time"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
