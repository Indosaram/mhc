[package]
name = "maho-omo-gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "LicenseRef-SUL-1.0"
autotests = false

[dependencies]
chrono = { workspace = true, features = ["clock"] }
dirs.workspace = true
futures.workspace = true
hex.workspace = true
maho-core = { path = "../../../maho-core" }
maho-ext-api = { path = "../../../maho-ext-api" }
maho-omo-agent-home = { path = "../maho-omo-agent-home" }
maho-omo-config-core = { path = "../../omo-config-core" }
maho-omo-config-resolution = { path = "../maho-omo-config-resolution" }
maho-rpc = { path = "../../../maho-rpc", version = "=0.0.0" }
regex.workspace = true
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror = "=2.0.20"
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
unicode-normalization.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
