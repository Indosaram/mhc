[package]
name = "maho-omo-formatter"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "LicenseRef-SUL-1.0"
autotests = false

[lints]
workspace = true

[dependencies]
tempfile.workspace = true
maho-ext-api = { path = "../../../maho-ext-api" }
maho-lsp-core = { path = "../../lsp-core" }
maho-lsp-daemon = { path = "../../lsp-daemon" }
maho-omo-post-mutation = { path = "../maho-omo-post-mutation" }
serde = { workspace = true, features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.52.3", features = ["process", "io-util", "fs", "sync", "time"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["macros", "rt", "time", "process"] }

[[test]]
name = "integration"
path = "tests/main.rs"
