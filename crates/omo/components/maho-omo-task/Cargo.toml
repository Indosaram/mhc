[package]
name = "maho-omo-task"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "LicenseRef-SUL-1.0"
autotests = false

[dependencies]
claude-code-compat-core = { path = "../../claude-code-compat-core" }
senpi-task = { package = "maho-senpi-task", path = "../../senpi-task" }
maho-ext-api = { path = "../../../maho-ext-api" }
maho-tui = { path = "../../../maho-tui" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
chrono = "=0.4.45"
team-core = { package = "maho-team-core", path = "../../team-core" }
regex = "=1.12.3"
utils = { package = "maho-utils", path = "../../utils" }
maho-model-core.workspace = true
maho-omo-lsp = { path = "../maho-omo-lsp" }
maho-omo-git-master = { path = "../maho-omo-git-master" }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

futures.workspace = true
telemetry-core = { package = "maho-telemetry-core", path = "../../telemetry-core" }

[dev-dependencies]
maho-ai = { path = "../../../maho-ai" }
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
