[package]
name = "maho-config-migration"
version.workspace = true
edition.workspace = true
license = "LicenseRef-SUL-1.0"
publish.workspace = true

[lib]
name = "config_migration"
path = "src/lib.rs"

[dependencies]
maho-utils.workspace = true
maho-omo-config-core.workspace = true
chrono = { workspace = true, features = ["default"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true

# Imported from COMP 93b78ac: this crate does not opt into `[lints] workspace = true`.
# The table mirrors the workspace lints; "allow" entries are the lints it trips (todo 2 allow list).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
