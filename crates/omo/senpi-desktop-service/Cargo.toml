[package]
name = "maho-senpi-desktop-service"
version.workspace = true
edition.workspace = true
license = "LicenseRef-SUL-1.0"
autotests = false

[lib]
name = "senpi_desktop_service"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
senpi-desktop-core = { package = "maho-senpi-desktop-core", path = "../../desktop/senpi-desktop-core" }
senpi-desktop-protocol = { package = "maho-senpi-desktop-protocol", path = "../senpi-desktop-protocol" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "process", "sync", "time", "rt"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "process", "io-std", "io-util"] }

[[test]]
name = "integration"
path = "tests/main.rs"
