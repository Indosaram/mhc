[package]
name = "maho-telemetry-core"
version.workspace = true
edition.workspace = true
license = "LicenseRef-SUL-1.0"
publish.workspace = true

[lib]
name = "telemetry_core"
path = "src/lib.rs"

[dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
futures.workspace = true
gethostname.workspace = true
hex.workspace = true
iana-time-zone.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
sys-locale.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
maho-utils.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

# Imported from COMP 93b78ac: this crate does not opt into `[lints] workspace = true`.
# The table mirrors the workspace lints; "allow" entries are the lints it trips (todo 2 allow list).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
