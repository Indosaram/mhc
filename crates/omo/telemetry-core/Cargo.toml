[package]
name = "maho-telemetry-core"
version.workspace = true
edition.workspace = true
license = "LicenseRef-SUL-1.0"
publish.workspace = true

[lib]
name = "telemetry_core"
path = "src/lib.rs"

[dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
flate2.workspace = true
futures.workspace = true
gethostname.workspace = true
hex.workspace = true
iana-time-zone.workspace = true
libc.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
sys-locale.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "fs"] }
url.workspace = true
uuid = { workspace = true, features = ["v4", "v7"] }
maho-utils.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
filetime.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

# Imported from COMP 93b78ac: this crate does not opt into `[lints] workspace = true`.
# The table mirrors the workspace lints; "allow" entries are the lints it trips (todo 2 allow list).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
