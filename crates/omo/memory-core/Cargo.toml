[package]
name = "maho-memory-core"
version.workspace = true
edition.workspace = true
license = "LicenseRef-SUL-1.0"
publish.workspace = true
autotests = false

[lib]
name = "memory_core"
path = "src/lib.rs"

[dependencies]

tempfile.workspace = true
loro = "=1.16.2"
saphyr-parser = "=0.2.2"
url.workspace = true
regex.workspace = true
aws-lc-rs = "=1.18.1"
base64.workspace = true
flate2.workspace = true
pkcs8 = "=0.10.2"
ryu-js = "=1.0.3"
tokio = { workspace = true, features = ["rt", "time", "sync"] }
zeroize = "=1.8.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
unicode-general-category.workspace = true
unicode-normalization.workspace = true
regress = { version = "=0.12.0", features = ["utf16"] }
icu_collator = "=2.3.1"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
filetime.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "test-util"] }

# Imported from COMP 93b78ac: this crate does not opt into `[lints] workspace = true`.
# The table mirrors the workspace lints; "allow" entries are the lints it trips (todo 2 allow list).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "allow"

[[test]]
name = "integration"
path = "tests/main.rs"
