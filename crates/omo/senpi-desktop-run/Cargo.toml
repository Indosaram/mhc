[package]
name = "maho-senpi-desktop-run"
version.workspace = true
edition.workspace = true
license = "MIT"

[lib]
name = "senpi_desktop_run"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
chrono = { workspace = true, features = ["clock"] }
maho-ai = { path = "../../maho-ai", version = "=0.0.0" }
maho-codemode = { path = "../../maho-codemode", version = "=0.0.0" }
maho-ext-api = { path = "../../maho-ext-api", version = "=0.0.0" }
senpi-desktop-core = { package = "maho-senpi-desktop-core", path = "../senpi-desktop-core" }
senpi-desktop-protocol = { package = "maho-senpi-desktop-protocol", path = "../senpi-desktop-protocol" }
senpi-desktop-service = { package = "maho-senpi-desktop-service", path = "../senpi-desktop-service" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
