[package]
name = "maho-lsp-core"
version.workspace = true
edition.workspace = true
license = "LicenseRef-SUL-1.0"
publish.workspace = true

[lib]
name = "lsp_core"
path = "src/lib.rs"

[dependencies]
futures.workspace = true
hex.workspace = true
indexmap.workspace = true
libc.workspace = true
maho-mcp-stdio-core.workspace = true
percent-encoding.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
url.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true

# Imported from COMP 93b78ac: this crate does not opt into `[lints] workspace = true`.
# The table mirrors the workspace lints; "allow" entries are the lints it trips (todo 2 allow list).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
