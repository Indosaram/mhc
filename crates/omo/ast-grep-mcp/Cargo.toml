[package]
name = "maho-ast-grep-mcp"
version.workspace = true
edition.workspace = true
license = "LicenseRef-SUL-1.0"
publish.workspace = true

[lib]
name = "ast_grep_mcp"
path = "src/lib.rs"

[[bin]]
name = "ast-grep-mcp"
path = "src/main.rs"

[dependencies]
fancy-regex.workspace = true
libc.workspace = true
maho-mcp-stdio-core.workspace = true
maho-utils.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true

# Imported from COMP 93b78ac: this crate does not opt into `[lints] workspace = true`.
# The table mirrors the workspace lints; "allow" entries are the lints it trips (todo 2 allow list).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "allow"
