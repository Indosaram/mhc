[package]
name = "maho-utils"
version.workspace = true
edition.workspace = true
license = "LicenseRef-SUL-1.0"
publish.workspace = true

[lib]
name = "utils"
path = "src/lib.rs"

[dependencies]
# Versions match entries already present in the workspace Cargo.lock.
chrono = { workspace = true, features = ["default"] }
dirs.workspace = true
fancy-regex.workspace = true
flate2.workspace = true
hex.workspace = true
libc.workspace = true
maho-omo-config-core.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true

# Imported from COMP 93b78ac: this crate does not opt into `[lints] workspace = true`.
# The table mirrors the workspace lints; "allow" entries are the lints it trips (todo 2 allow list).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "allow"
