[package]
name = "maho-senpi-desktop-backend-fake"
version.workspace = true
edition = "2021"
license = "MIT"
autotests = false

[lib]
name = "senpi_desktop_backend_fake"
crate-type = ["rlib"]

[dependencies]
image = { version = "=0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
parking_lot = "=0.12.5"
senpi-desktop-core = { package = "maho-senpi-desktop-core", path = "../senpi-desktop-core" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
