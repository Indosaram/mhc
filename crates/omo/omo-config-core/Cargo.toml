[package]
name = "maho-omo-config-core"
version.workspace = true
edition.workspace = true
license = "LicenseRef-SUL-1.0"
publish.workspace = true
autotests = false

[lib]
name = "omo_config_core"
path = "src/lib.rs"

[dependencies]
# Versions are pinned to the versions already present in this workspace's
# Cargo.lock (seeded from the FORK's lock); do not `cargo add`.
jiff.workspace = true
hex.workspace = true
libc.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true

# Imported from COMP 93b78ac: this crate does not opt into `[lints] workspace = true`.
# The table mirrors the workspace lints; "allow" entries are the lints it trips (todo 2 allow list).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "allow"

[[test]]
name = "integration"
path = "tests/main.rs"
