[package]
name = "maho-comment-checker-core"
version.workspace = true
edition.workspace = true
license = "LicenseRef-SUL-1.0"
publish.workspace = true

[lib]
name = "comment_checker_core"
path = "src/lib.rs"

[dependencies]
maho-utils.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["io-util", "macros", "time"] }
url.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "test-util", "time"] }

# Real-subprocess integration (`tests/runner_process.rs`) sends SIGTERM to the child it spawns.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.28.0", features = ["signal", "process"] }

# Imported from COMP 93b78ac: this crate does not opt into `[lints] workspace = true`.
# The table mirrors the workspace lints; "allow" entries are the lints it trips (todo 2 allow list).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
