[package]
name = "maho-senpi-desktop-backend-atspi"
version.workspace = true
edition = "2021"
license = "MIT"

[lib]
name = "senpi_desktop_backend_atspi"
crate-type = ["rlib"]

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "=0.30.0", features = ["tokio", "zbus"] }
senpi-desktop-core = { package = "maho-senpi-desktop-core", path = "../senpi-desktop-core" }
tokio = { workspace = true, features = ["time"] }
zbus = { version = "=5.19.0", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
