[package]
name = "maho-model-core"
version.workspace = true
edition.workspace = true
license = "LicenseRef-SUL-1.0"
publish.workspace = true

[lib]
name = "model_core"
path = "src/lib.rs"

[dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
indexmap = { workspace = true, features = ["serde"] }
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true

[dev-dependencies]
futures.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true

[[test]]
name = "parity"
path = "tests/parity/main.rs"

# Imported from COMP 93b78ac: this crate does not opt into `[lints] workspace = true`.
# The table mirrors the workspace lints; "allow" entries are the lints it trips (todo 2 allow list).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
