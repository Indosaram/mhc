[package]
name = "maho-tui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"
autotests = false

# Mirrors the workspace lints; unsafe_code is deny (not forbid) so the Windows console-input wait
# in src/terminal.rs can allow it locally.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"

[dependencies]
crossterm = "=0.29.0"
dirs = { workspace = true }
fancy-regex = { workspace = true }
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
indexmap = { workspace = true }
jiff = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = "=1.13.3"
unicode-width = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["event", "fs", "process", "stdio", "termios"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "=0.13.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = "=0.3.2"
objc2-core-graphics = "=0.3.2"
objc2-foundation = "=0.3.2"
png = "=0.18.1"
tiff = "=0.9.1"

[target.'cfg(windows)'.dependencies]
clipboard-win = "=5.4.1"
crossterm_winapi = "=0.9.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
maho-test-support = { path = "../maho-test-support" }

[[example]]
name = "key-tester"
path = "examples/key-tester.rs"

[[test]]
name = "integration"
path = "tests/main.rs"
