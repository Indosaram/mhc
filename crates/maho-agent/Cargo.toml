[package]
name = "maho-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lints]
workspace = true

[dependencies]
maho-ai = { path = "../maho-ai" }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-util = "=0.7.18"
unicode-normalization = "=0.1.25"
ignore = "=0.4.33"
serde_yaml = "=0.9.34"
tree-sitter = "=0.25.10"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"

[dev-dependencies]
sha2 = "=0.10.9"
maho-test-support = { path = "../maho-test-support" }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
