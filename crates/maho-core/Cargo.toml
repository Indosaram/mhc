[package]
name = "maho-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"
autotests = false

[dependencies]
maho-ai = { path = "../maho-ai" }
maho-agent = { path = "../maho-agent" }
maho-tui = { path = "../maho-tui" }
maho-ext-api = { path = "../maho-ext-api" }
maho-tool-child = { path = "../maho-tool-child" }
maho-ext-host = { path = "../maho-ext-host" }
maho-tools = { path = "../maho-tools" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["clock", "std", "alloc"] }
sha2 = { workspace = true }
hex = { workspace = true }
filetime = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }
tokio = { workspace = true, features = ["fs", "sync", "time", "macros", "rt", "io-util", "process"] }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
futures = { workspace = true }
indexmap = { workspace = true }
serde_yaml = "=0.9.34"
ignore = "=0.4.33"
async-trait = "=0.1.92"
anyhow = "=1.0.104"
globset = "=0.4.20"
fancy-regex = "=0.16.2"
semver = "=1.0.27"
base64 = "=0.22.1"
jiff = { workspace = true }
photon-rs = { version = "=0.3.3", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.28.0", features = ["signal", "process", "user", "feature"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
flate2 = { workspace = true }
maho-ext-recommended-models = { path = "../builtins/maho-ext-recommended-models" }
maho-ext-permission-system = { path = "../builtins/maho-ext-permission-system" }

# Mirrors the workspace lints with unsafe_code = "deny": auth_storage.rs calls Win32 security APIs
# (owner-only DACL on auth.json), each behind a local allow with SAFETY comments.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"

[[test]]
name = "integration"
path = "tests/main.rs"
