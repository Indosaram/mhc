[package]
name = "maho-ext-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
maho-ext-api = { path = "../maho-ext-api" }
maho-ai = { path = "../maho-ai" }
async-trait = "=0.1.92"
anyhow = "=1.0.104"
tokio = { version = "=1.52.3", features = ["time", "sync", "rt", "macros", "process", "io-util"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.28.0", features = ["signal"] }

[dev-dependencies]
tokio = { version = "=1.52.3", features = ["test-util"] }
maho-test-support = { path = "../maho-test-support", features = ["sdk"] }
maho-core = { path = "../maho-core" }
serde_json = "=1.0.149"
tempfile = "=3.27.0"

[lints]
workspace = true
