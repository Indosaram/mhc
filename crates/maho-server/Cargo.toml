[package]
name = "maho-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order", "float_roundtrip"] }
thiserror = "=2.0.18"
uuid = { version = "=1.20.0", features = ["v4", "v7"] }
rusqlite = { version = "=0.33.0", features = ["bundled"] }
maho-agent = { path = "../maho-agent" }
maho-ext-host = { path = "../maho-ext-host" }
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["net", "io-util", "sync", "rt", "macros", "time", "fs"] }

[dev-dependencies]
tempfile = "=3.27.0"
maho-ext-api = { path = "../maho-ext-api" }

[lints]
workspace = true
