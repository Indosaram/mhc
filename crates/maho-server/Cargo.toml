[package]
name = "maho-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order", "float_roundtrip"] }
thiserror = "=2.0.18"
uuid = { version = "=1.20.0", features = ["v4", "v7"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache"] }
maho-agent = { path = "../maho-agent" }
maho-core = { path = "../maho-core" }
maho-rpc = { path = "../maho-rpc" }
maho-tui = { path = "../maho-tui" }
maho-interactive = { path = "../maho-interactive" }
maho-ext-mcp = { path = "../builtins/maho-ext-mcp" }
maho-ext-ask-user = { path = "../builtins/maho-ext-ask-user" }
maho-ai = { path = "../maho-ai" }
maho-ext-host = { path = "../maho-ext-host" }
maho-ext-api = { path = "../maho-ext-api" }
sha2 = "=0.10.9"
subtle = "=2.6.1"
rand = "=0.9.3"
futures-util = { version = "=0.3.34", features = ["sink"] }
tokio-tungstenite = "=0.28.0"
httparse = "=1.10.1"
indexmap = "=2.14.0"
url = "=2.5.8"
chrono = "=0.4.43"
base64 = "=0.22.1"
ignore = "=0.4.33"
tokio = { version = "=1.52.3", features = ["net", "io-util", "io-std", "signal", "sync", "rt", "macros", "time", "fs", "process"] }

[dev-dependencies]
tempfile = "=3.27.0"
maho-ext-api = { path = "../maho-ext-api" }
maho-test-support = { path = "../maho-test-support", features = ["sdk"] }

[lints]
workspace = true
