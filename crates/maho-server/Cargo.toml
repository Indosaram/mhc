[package]
name = "maho-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"
autotests = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order", "float_roundtrip"] }
thiserror = "=2.0.20"
uuid = { version = "=1.20.0", features = ["v4", "v7"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache"] }
maho-agent = { path = "../maho-agent" }
maho-chord = { path = "../maho-chord" }
maho-ai = { path = "../maho-ai" }
sha2 = "=0.10.9"
futures-util = { version = "=0.3.34", features = ["sink"] }
tokio = { version = "=1.52.3", features = ["net", "io-util", "io-std", "signal", "sync", "rt", "macros", "time", "fs", "process"] }

[dev-dependencies]
tokio = { version = "=1.52.3", features = ["test-util"] }
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
