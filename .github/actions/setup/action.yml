name: setup
description: Free runner disk, install the pinned Rust toolchain, protoc, bun and the pinned senpi checkout (Linux, macOS, Windows).
inputs:
  cache-key:
    description: Cargo cache key; each test shard needs its own, since their target dirs differ.
    required: true
runs:
  using: composite
  steps:
    - name: free disk
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        df -h /

    - name: rust toolchain
      shell: bash
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustc --version

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: protoc
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux) asset=linux-x86_64 ;;
          macOS) asset=osx-aarch_64 ;;
          Windows) asset=win64 ;;
        esac
        curl -sSLo "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${asset}.zip"
        unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
        echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc$([ "$RUNNER_OS" = Windows ] && echo .exe)" >> "$GITHUB_ENV"
        "$RUNNER_TEMP/protoc/bin/protoc" --version

    - uses: oven-sh/setup-bun@v2

    - uses: actions/setup-node@v7
      with:
        node-version: "24"

    # Grep, find and ast-grep tests drive the real rg / fd / sg executables.
    - name: search tools
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux) sudo apt-get install -y -qq ripgrep fd-find >/dev/null; fd=fdfind ;;
          macOS) brew install --quiet ripgrep fd >/dev/null; fd=fd ;;
          Windows)
            choco install -y --no-progress ripgrep fd >/dev/null
            # choco's shims dir reaches PATH only in later steps.
            export PATH="/c/ProgramData/chocolatey/bin:$PATH"
            echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
            fd=fd ;;
        esac
        npm install -g --silent "@ast-grep/cli@${AST_GREP_VERSION}"
        if [ "$RUNNER_OS" = Windows ]; then
          # npm's sg.cmd shim cannot take quoted/multi-line arguments (Rust rejects them for batch
          # files); put the native ast-grep.exe / sg.exe that postinstall placed on PATH first.
          sgdir="$(npm root -g)/@ast-grep/cli"
          export PATH="$sgdir:$PATH"
          cygpath -w "$sgdir" >> "$GITHUB_PATH"
        fi
        rg --version | head -1 && "$fd" --version && sg --version

    - name: cache senpi checkout
      id: senpi-cache
      uses: actions/cache@v6
      with:
        path: ~/code/senpi
        key: senpi-${{ env.SENPI_PIN }}

    - name: pinned senpi checkout
      if: steps.senpi-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git init -q ~/code/senpi
        git -C ~/code/senpi remote add origin https://github.com/code-yeongyu/senpi.git
        git -C ~/code/senpi fetch -q --depth 1 origin "$SENPI_PIN"
        git -C ~/code/senpi checkout -q FETCH_HEAD
        cd ~/code/senpi && bun install --frozen-lockfile --ignore-scripts

    - name: git identity for tests
      shell: bash
      run: |
        git config --global user.name ci
        git config --global user.email ci@example.invalid
        git -C ~/code/senpi rev-parse HEAD
