name: ci

on:
  push:
    branches: [main, "verify/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"
  # CI builds are candidate builds: they embed the non-production test key so the
  # `native_update_*` integration tests can sign and verify their fixture releases.
  # Release builds (release.yml) set their own real key and channel.
  MHC_RELEASE_PUBKEY_FILE: crates/maho-cli/tests/fixtures/release-test-key/test.pub
  MHC_RELEASE_CHANNEL: candidate
  # Full debuginfo for ~140 crates' test binaries is far larger than line tables.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  PROTOC_VERSION: "29.3"
  # Must equal PINNED_VERSION in assets/skills/ast-grep/install.sh.
  AST_GREP_VERSION: "0.45.0"
  # Must equal SENPI_PIN in tools/golden/pin.mjs; golden tests refuse any other senpi commit.
  SENPI_PIN: 903b83367545bea516f35fc7f7c7cb692847988d

jobs:
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: clippy
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: disk usage
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: build
      - name: build mhc binary
        run: cargo build -p maho-cli --locked
      - name: disk usage
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  # MIT build of `mhc` (docs/MIT-PROFILE.md): license policy, clippy, binaries, smoke and tests.
  mit-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: mit-profile
      - name: check-mit-profile self-test
        run: python3 scripts/check-mit-profile.py --self-test
      - name: no crates/omo package or SUL license in the workspace dependency graph
        run: python3 scripts/check-mit-profile.py
      - name: install cargo-deny
        run: |
          curl -sSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: cargo deny licenses (MIT profile, whole workspace)
        run: cargo deny --workspace --config deny-mit.toml check licenses
      - name: cargo clippy (MIT profile)
        run: cargo clippy -p maho-cli --lib --bins --locked -- -D warnings
      - name: build MIT-profile binaries
        run: cargo build -p maho-cli --bins --locked && cargo build -p maho-senpi-desktop-engine --locked
      - name: smoke (chat + builtin tools, removed omo entries unavailable)
        run: python3 scripts/mit-profile-smoke.py target/debug/mhc
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: maho-cli tests (MIT profile)
        timeout-minutes: 40
        run: python3 scripts/annotate-nextest.py maho-cli-mit-tests -- cargo nextest run --locked --no-fail-fast -p maho-cli
      - name: disk usage
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  license-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: license audit
        run: bun tools/license-audit.mjs
      - name: package-native self-test
        run: bun tools/package-native.mjs --self-test

  # One job building every test binary filled the runner disk (`No space left on device`), so
  # each shard builds and runs only its own crates; scripts/ci-shard.py covers every member once.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: test-${{ matrix.shard }}
      - name: install bubblewrap (bash sandbox tests)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: allow unprivileged user namespaces for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: bwrap smoke
        run: bwrap --ro-bind / / true
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: select crates
        run: echo "CRATES=$(python3 scripts/ci-shard.py 6 ${{ matrix.shard }})" >> "$GITHUB_ENV"
      - name: build tests (shard ${{ matrix.shard }}/6)
        run: |
          cargo nextest run --locked --no-run $CRATES
          cargo build --locked -p maho-senpi-desktop-engine
      - name: run tests (shard ${{ matrix.shard }}/6)
        timeout-minutes: 20
        env:
          MHC_REQUIRE_SANDBOX_TEST: "1"
        run: cargo nextest run --locked --no-fail-fast $CRATES
      - name: disk usage
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: macos
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings

  macos-test:
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: macos-test-${{ matrix.shard }}
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: select crates
        run: echo "CRATES=$(python3 scripts/ci-shard.py 2 ${{ matrix.shard }})" >> "$GITHUB_ENV"
      - name: build tests (shard ${{ matrix.shard }}/2)
        run: |
          cargo nextest run --locked --no-run $CRATES
          cargo build --locked -p maho-senpi-desktop-engine
      - name: run tests (shard ${{ matrix.shard }}/2)
        timeout-minutes: 40
        run: cargo nextest run --locked --no-fail-fast $CRATES

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: windows
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: build mhc binary
        run: cargo build -p maho-cli --locked

  windows-test:
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: windows-test-${{ matrix.shard }}
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: select crates
        run: echo "CRATES=$(python scripts/ci-shard.py 3 ${{ matrix.shard }})" >> "$GITHUB_ENV"
      - name: build tests (shard ${{ matrix.shard }}/3)
        run: |
          cargo nextest run --locked --no-run $CRATES
          cargo build --locked -p maho-senpi-desktop-engine
      - name: run tests (shard ${{ matrix.shard }}/3)
        timeout-minutes: 40
        run: cargo nextest run --locked --no-fail-fast $CRATES

  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: clone senpi
        run: git clone --filter=blob:none https://github.com/code-yeongyu/senpi.git /tmp/senpi
      - name: check pins
        run: bun tools/check-pins.mjs --ancestry /tmp/senpi

