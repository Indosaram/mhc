name: ci

on:
  push:
    branches: [main, "verify/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"
  # Full debuginfo for ~140 crates' test binaries is far larger than line tables.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  PROTOC_VERSION: "29.3"
  # Must equal PINNED_VERSION in assets/omo-latest/skills/ast-grep/install.sh.
  AST_GREP_VERSION: "0.45.0"
  # Must equal SENPI_PIN in tools/golden/pin.mjs; golden tests refuse any other senpi commit.
  SENPI_PIN: cf69f5e72eb325219a93e17bb54bbd4ba787899e

jobs:
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: clippy
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: disk usage
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: build
      - name: build mhc binary
        run: cargo build -p maho-cli --locked
      - name: disk usage
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  # One job building every test binary filled the runner disk (`No space left on device`), so
  # each shard builds and runs only its own crates; scripts/ci-shard.py covers every member once.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: test-${{ matrix.shard }}
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: select crates
        run: echo "CRATES=$(python3 scripts/ci-shard.py 6 ${{ matrix.shard }})" >> "$GITHUB_ENV"
      - name: build tests (shard ${{ matrix.shard }}/6)
        run: |
          cargo nextest run --locked --no-run $CRATES
          cargo build --locked -p maho-senpi-desktop-engine
      - name: run tests (shard ${{ matrix.shard }}/6)
        timeout-minutes: 20
        run: cargo nextest run --locked --no-fail-fast --tool-config-file "ci:$GITHUB_WORKSPACE/.github/nextest.toml" $CRATES
      - name: disk usage
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  # Windows: clippy and the mhc build. The test suite still assumes POSIX in many places
  # (/bin/sh, HOME, `/` paths), so it is not run here yet.
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: protoc
        run: |
          curl -sSLo "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-win64.zip"
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc.exe" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: search tools
        run: |
          choco install -y --no-progress ripgrep fd >/dev/null
          npm install -g --silent "@ast-grep/cli@${AST_GREP_VERSION}"
          rg --version | head -1 && fd --version && sg --version
      - name: git identity for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: build mhc binary
        run: cargo build -p maho-cli --locked
