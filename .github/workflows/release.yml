name: release

# Pushing a `v<version>` tag builds release mhc binaries and publishes them as a GitHub Release.
# The tag without its leading `v` becomes MHC_BUILD_VERSION (what `mhc --version` prints).
# Cache warm-up: dispatching on main with no tag only builds, saving the release build cache on main.
# A tag run can restore caches from main but not from another tag, so tag runs do not save.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v2026.10.18. Empty = warm the build cache on the selected branch.
        required: false
        default: ""

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  PROTOC_VERSION: "29.3"
  TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            protoc: linux-x86_64
          - target: macos-aarch64
            runner: macos-15
            protoc: osx-aarch_64
          - target: windows-x86_64
            runner: windows-2025
            protoc: win64
            exe: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG != '' && format('refs/tags/{0}', env.TAG) || github.sha }}

      - name: free disk
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ env.TAG == '' }}

      - name: protoc
        run: |
          curl -sSLo "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${{ matrix.protoc }}.zip"
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc$EXE" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/protoc/bin/protoc$EXE" --version

      - uses: oven-sh/setup-bun@v2

      - name: build release binaries
        run: |
          export MHC_BUILD_VERSION="${TAG:+${TAG#v}}"
          export MHC_BUILD_VERSION="${MHC_BUILD_VERSION:-0.0.0-cache}"
          cargo build --release --locked -p maho-cli -p maho-ast-grep-mcp -p maho-lsp-daemon -p maho-git-bash-mcp -p maho-senpi-desktop-engine --bins
          test "$(./target/release/mhc$EXE --version | tr -d '\r')" = "$MHC_BUILD_VERSION"

      - name: materialize browser skill runtime
        if: env.TAG != ''
        run: |
          commit=$(bun -e 'console.log((await Bun.file("assets/omo-latest/manifest.json").json()).browserRuntime.dependency.commit)')
          git init -q "$RUNNER_TEMP/omowright"
          git -C "$RUNNER_TEMP/omowright" fetch -q --depth 1 https://github.com/code-yeongyu/omowright.git "$commit"
          git -C "$RUNNER_TEMP/omowright" checkout -q FETCH_HEAD
          (cd "$RUNNER_TEMP/omowright" && bun install --frozen-lockfile --ignore-scripts --production)
          node assets/omo-latest/stage-omowright-runtime.mjs --source "$RUNNER_TEMP/omowright" --target "$RUNNER_TEMP/omowright-runtime"

      - name: package
        if: env.TAG != ''
        run: |
          name="mhc-${{ matrix.target }}"
          bun tools/package-native.mjs --binary "target/release/mhc$EXE" --output "dist/$name" --skill-source latest \
            --git-bash-binary "target/release/omo-git-bash$EXE" --desktop-engine-binary "target/release/senpi-desktop-engine$EXE" \
            --omowright-runtime "$RUNNER_TEMP/omowright-runtime"
          test -x "dist/$name/senpi-desktop-engine$EXE"
          bun tools/package-native.mjs --verify-only "dist/$name"
          "dist/$name/mhc$EXE" --version
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && 7z a -tzip -bso0 "$name.zip" "$name" && sha256sum "$name.zip" > "$name.zip.sha256")
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi

      - uses: actions/upload-artifact@v7
        if: env.TAG != ''
        with:
          name: mhc-${{ matrix.target }}
          path: |
            dist/*.tar.gz*
            dist/*.zip*
          retention-days: 7

  publish:
    needs: build
    if: github.event.inputs.tag != '' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "mhc ${TAG}" --generate-notes
          fi
