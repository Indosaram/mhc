name: release

# Pushing a `v<version>` tag builds release mhc binaries and publishes them as a GitHub Release.
# The tag without its leading `v` becomes MHC_BUILD_VERSION (what `mhc --version` prints).
# Cache warm-up: dispatching on main with no tag only builds, saving the release build cache on main.
# A tag run can restore caches from main but not from another tag, so tag runs do not save.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v2026.10.18. Empty = warm the build cache on the selected branch.
        required: false
        default: ""
      candidate_version:
        description: Candidate version string for QA packages (e.g. 2026.10.20.1). Produces full packages without publishing.
        required: false
        default: ""
      candidate_pair:
        description: Build candidate pair A (candidate_version_a) and B (candidate_version_b) from same source without publishing.
        type: boolean
        required: false
        default: false
      candidate_version_a:
        description: Candidate pair version A (older), e.g. 2026.10.20.1. Required with candidate_pair.
        required: false
        default: ""
      candidate_version_b:
        description: Candidate pair version B (newer), e.g. 2026.10.20.2. Required with candidate_pair.
        required: false
        default: ""
      package:
        description: Force complete package generation and artifact upload even without a tag.
        type: boolean
        required: false
        default: false
      publish:
        description: Publish release assets to GitHub Releases (set false for candidate QA runs).
        type: boolean
        required: false
        default: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.event.inputs.candidate_version || (github.event.inputs.candidate_pair == 'true' && 'candidate-pair') || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  PROTOC_VERSION: "29.3"
  TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  CANDIDATE_VERSION: ${{ github.event.inputs.candidate_version || '' }}
  CANDIDATE_PAIR: ${{ github.event.inputs.candidate_pair || 'false' }}
  VER_A: ${{ github.event.inputs.candidate_version_a || '' }}
  VER_B: ${{ github.event.inputs.candidate_version_b || '' }}
  DO_PACKAGE: ${{ github.event.inputs.package == 'true' || github.event.inputs.candidate_pair == 'true' || github.event.inputs.candidate_version != '' || (github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name)) != '' }}
  DO_PUBLISH: ${{ (github.event.inputs.publish != 'false') && (github.event.inputs.tag != '' || github.ref_type == 'tag') && github.event.inputs.candidate_pair != 'true' && github.event.inputs.candidate_version == '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            protoc: linux-x86_64
          - target: macos-aarch64
            runner: macos-15
            protoc: osx-aarch_64
          - target: windows-x86_64
            runner: windows-2025
            protoc: win64
            exe: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG != '' && format('refs/tags/{0}', env.TAG) || github.sha }}

      - name: free disk
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ env.TAG == '' }}

      - name: protoc
        run: |
          curl -sSLo "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${{ matrix.protoc }}.zip"
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc$EXE" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/protoc/bin/protoc$EXE" --version

      - uses: oven-sh/setup-bun@v2

      - name: zig + cargo-zigbuild (glibc 2.28 floor)
        if: matrix.target == 'linux-x86_64'
        run: |
          pip3 install --break-system-packages ziglang cargo-zigbuild
          rustup target add x86_64-unknown-linux-gnu
          python3 -m ziglang version

      - name: build release binaries
        run: |
          # Linux builds with a glibc 2.28 floor via cargo-zigbuild, then lands in target/release.
          build_release() {
            if [ "${{ matrix.target }}" = linux-x86_64 ]; then
              cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.28 "$@"
              mkdir -p target/release
              for bin in mhc mhc-launcher ast-grep-mcp lsp-daemon omo-git-bash senpi-desktop-engine; do
                if [ -f "target/x86_64-unknown-linux-gnu/release/$bin" ]; then cp "target/x86_64-unknown-linux-gnu/release/$bin" target/release/; fi
              done
            else
              cargo build --release --locked "$@"
            fi
          }
          if [ "$CANDIDATE_PAIR" = "true" ]; then
            if [ -z "$VER_A" ] || [ -z "$VER_B" ] || [ "$VER_A" = "$VER_B" ]; then
              echo "candidate_pair needs distinct candidate_version_a and candidate_version_b inputs" >&2
              exit 1
            fi
            echo "Building candidate pair: A=$VER_A and B=$VER_B"
            export MHC_BUILD_VERSION="${VER_A#v}"
            build_release -p maho-cli -p maho-ast-grep-mcp -p maho-lsp-daemon -p maho-git-bash-mcp -p maho-senpi-desktop-engine --bins
            test "$(./target/release/mhc$EXE --version | tr -d '\r')" = "$MHC_BUILD_VERSION"
            test -f "target/release/mhc-launcher$EXE"
            mkdir -p target/release-A target/release-B
            cp target/release/mhc$EXE target/release-A/
            export MHC_BUILD_VERSION="${VER_B#v}"
            touch crates/maho-cli/src/main.rs
            build_release -p maho-cli --bins
            test "$(./target/release/mhc$EXE --version | tr -d '\r')" = "$MHC_BUILD_VERSION"
            cp target/release/mhc$EXE target/release-B/
          else
            export MHC_BUILD_VERSION="${CANDIDATE_VERSION:+${CANDIDATE_VERSION#v}}"
            export MHC_BUILD_VERSION="${MHC_BUILD_VERSION:-${TAG:+${TAG#v}}}"
            export MHC_BUILD_VERSION="${MHC_BUILD_VERSION:-0.0.0-cache}"
            build_release -p maho-cli -p maho-ast-grep-mcp -p maho-lsp-daemon -p maho-git-bash-mcp -p maho-senpi-desktop-engine --bins
            test "$(./target/release/mhc$EXE --version | tr -d '\r')" = "$MHC_BUILD_VERSION"
            test -f "target/release/mhc-launcher$EXE"
          fi

      - name: materialize browser skill runtime
        if: env.DO_PACKAGE == 'true'
        run: |
          commit=$(bun -e 'console.log((await Bun.file("assets/omo-latest/manifest.json").json()).browserRuntime.dependency.commit)')
          git init -q "$RUNNER_TEMP/omowright"
          git -C "$RUNNER_TEMP/omowright" fetch -q --depth 1 https://github.com/code-yeongyu/omowright.git "$commit"
          git -C "$RUNNER_TEMP/omowright" checkout -q FETCH_HEAD
          (cd "$RUNNER_TEMP/omowright" && bun install --frozen-lockfile --ignore-scripts --production)
          node assets/omo-latest/stage-omowright-runtime.mjs --source "$RUNNER_TEMP/omowright" --target "$RUNNER_TEMP/omowright-runtime"

      - name: package
        if: env.DO_PACKAGE == 'true'
        run: |
          assert_archive_has_both_executables() {
            archive="$1"; top="$2"
            if [ "${archive##*.}" = zip ]; then
              listing=$(7z l -slt "$archive" | tr '\\' '/' | tr -d '\r')
              for exe in "mhc$EXE" "mhc-launcher$EXE"; do printf '%s\n' "$listing" | grep -Fx "Path = $top/$exe" > /dev/null || { echo "$archive lacks $top/$exe" >&2; exit 1; }; done
            else
              listing=$(tar -tzf "$archive")
              for exe in "mhc$EXE" "mhc-launcher$EXE"; do printf '%s\n' "$listing" | grep -Fx "$top/$exe" > /dev/null || { echo "$archive lacks $top/$exe" >&2; exit 1; }; done
            fi
          }
          if [ "$CANDIDATE_PAIR" = "true" ]; then
            for letter in A B; do
              if [ "$letter" = A ]; then ver="${VER_A#v}"; else ver="${VER_B#v}"; fi
              name="mhc-${{ matrix.target }}"
              out_dir="dist/candidate-${letter}/${name}"
              mkdir -p "dist/candidate-${letter}"
              cp "target/release-${letter}/mhc$EXE" "target/release/mhc$EXE"
              bun tools/package-native.mjs --binary "target/release/mhc$EXE" --launcher-binary "target/release/mhc-launcher$EXE" --output "$out_dir" --skill-source latest \
                --git-bash-binary "target/release/omo-git-bash$EXE" --desktop-engine-binary "target/release/senpi-desktop-engine$EXE" \
                --omowright-runtime "$RUNNER_TEMP/omowright-runtime"
              test -x "$out_dir/senpi-desktop-engine$EXE"
              test -x "$out_dir/mhc-launcher$EXE"
              bun tools/package-native.mjs --verify-only "$out_dir"
              test "$("$out_dir/mhc$EXE" --version | tr -d '\r')" = "$ver"
              test "$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).versions.mhc' "$out_dir/manifest.json" | tr -d '\r')" = "$ver"
              if [ "$RUNNER_OS" = Windows ]; then
                (cd "dist/candidate-${letter}" && 7z a -tzip -bso0 "${name}.zip" "$name" && sha256sum "${name}.zip" > "${name}.zip.sha256")
                assert_archive_has_both_executables "dist/candidate-${letter}/${name}.zip" "$name"
              else
                tar -C "dist/candidate-${letter}" -czf "dist/candidate-${letter}/${name}.tar.gz" "$name"
                (cd "dist/candidate-${letter}" && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
                assert_archive_has_both_executables "dist/candidate-${letter}/${name}.tar.gz" "$name"
              fi
            done
          else
            name="mhc-${{ matrix.target }}"
            bun tools/package-native.mjs --binary "target/release/mhc$EXE" --launcher-binary "target/release/mhc-launcher$EXE" --output "dist/$name" --skill-source latest \
              --git-bash-binary "target/release/omo-git-bash$EXE" --desktop-engine-binary "target/release/senpi-desktop-engine$EXE" \
              --omowright-runtime "$RUNNER_TEMP/omowright-runtime"
            test -x "dist/$name/senpi-desktop-engine$EXE"
            test -x "dist/$name/mhc-launcher$EXE"
            bun tools/package-native.mjs --verify-only "dist/$name"
            "dist/$name/mhc$EXE" --version
            if [ "$RUNNER_OS" = Windows ]; then
              (cd dist && 7z a -tzip -bso0 "$name.zip" "$name" && sha256sum "$name.zip" > "$name.zip.sha256")
              assert_archive_has_both_executables "dist/$name.zip" "$name"
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
              (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
              assert_archive_has_both_executables "dist/$name.tar.gz" "$name"
            fi
          fi

      - uses: actions/upload-artifact@v7
        if: env.DO_PACKAGE == 'true'
        with:
          name: mhc-${{ matrix.target }}
          path: |
            dist/*.tar.gz*
            dist/*.zip*
            dist/candidate-*/*.tar.gz*
            dist/candidate-*/*.zip*
          retention-days: 7

  publish:
    needs: build
    if: ${{ github.event.inputs.publish != 'false' && (github.event.inputs.tag != '' || github.ref_type == 'tag') && github.event.inputs.candidate_pair != 'true' && github.event.inputs.candidate_version == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mhc-*
          path: dist
          merge-multiple: true

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "mhc ${TAG}" --generate-notes
          fi
