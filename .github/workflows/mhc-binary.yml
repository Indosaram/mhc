name: mhc-binary

# Complete mhc package (payload, launcher, siblings, skills, manifest) for a local install.
# scripts/gh-install.sh pushes `build/<version>`; the branch name after `build/` becomes
# MHC_BUILD_VERSION (what `mhc --version` prints) and the versions/<version>/ directory name.
on:
  push:
    branches: ["build/**"]

concurrency:
  group: mhc-binary-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  PROTOC_VERSION: "29.3"
  AST_GREP_VERSION: "0.45.0"
  SENPI_PIN: cf69f5e72eb325219a93e17bb54bbd4ba787899e

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - name: zig + cargo-zigbuild (glibc 2.28 floor)
        run: |
          pip3 install --break-system-packages ziglang cargo-zigbuild
          rustup target add x86_64-unknown-linux-gnu
      - name: build release binaries
        run: |
          export MHC_BUILD_VERSION="${GITHUB_REF_NAME#build/}"
          cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.28 -p maho-cli -p maho-lsp -p maho-senpi-desktop-engine -p maho-git-bash -p maho-ast-grep --bins
          mkdir -p target/release
          for bin in mhc mhc-launcher mhc-lsp senpi-desktop-engine mhc-git-bash mhc-ast-grep; do
            if [ -f "target/x86_64-unknown-linux-gnu/release/$bin" ]; then cp "target/x86_64-unknown-linux-gnu/release/$bin" target/release/; fi
          done
          test "$(./target/release/mhc --version)" = "$MHC_BUILD_VERSION"
          test -x target/release/mhc-launcher

      - name: materialize browser skill runtime
        run: |
          commit=$(bun -e 'console.log((await Bun.file("assets/skills/manifest.json").json()).browserRuntime.dependency.commit)')
          git init -q "$RUNNER_TEMP/omowright"
          git -C "$RUNNER_TEMP/omowright" fetch -q --depth 1 https://github.com/code-yeongyu/omowright.git "$commit"
          git -C "$RUNNER_TEMP/omowright" checkout -q FETCH_HEAD
          (cd "$RUNNER_TEMP/omowright" && bun install --frozen-lockfile --ignore-scripts --production)
          node tools/stage-omowright-runtime.mjs --source "$RUNNER_TEMP/omowright" --target "$RUNNER_TEMP/omowright-runtime"

      - name: package
        env:
          # Dev installs target this machine, built natively on ubuntu-24.04 (glibc 2.39); the 2.28
          # floor is for published releases, which build with cargo-zigbuild (release.yml).
          MHC_GLIBC_CEILING: "2.39"
        run: |
          export MHC_BUILD_VERSION="${GITHUB_REF_NAME#build/}"
          name=mhc-linux-x86_64
          bun tools/package-native.mjs --binary target/release/mhc --launcher-binary target/release/mhc-launcher --output "dist/$name" \
            --mhc-lsp-binary target/release/mhc-lsp --desktop-engine-binary target/release/senpi-desktop-engine \
            --git-bash-binary target/release/mhc-git-bash --ast-grep-binary target/release/mhc-ast-grep \
            --omowright-runtime "$RUNNER_TEMP/omowright-runtime"
          bun tools/package-native.mjs --verify-only "dist/$name"
          test -x "dist/$name/mhc" && test -x "dist/$name/mhc-launcher"
          test "$("dist/$name/mhc" --version)" = "$MHC_BUILD_VERSION"
          scripts/package-archive.sh dist "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: mhc-linux-x86_64
          path: |
            dist/mhc-linux-x86_64.tar.gz
            dist/mhc-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
