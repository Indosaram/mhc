name: tmp-omo

on:
  push:
    branches: ['ci/fix-main-ci-20261103-omo-*']

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"
  MHC_RELEASE_PUBKEY_FILE: crates/maho-cli/tests/fixtures/release-test-key/test.pub
  MHC_RELEASE_CHANNEL: candidate
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  PROTOC_VERSION: "29.3"
  AST_GREP_VERSION: "0.45.0"
  SENPI_PIN: 59d58cee59d76bbecc83be828b59ff5420eb74df
  CRATES: -p maho-omo-onboarding -p maho-omo -p maho-ext-pi-ast-grep -p maho-ext-mcp

jobs:
  omo:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: tmp-omo-${{ matrix.os }}
      - name: install bubblewrap (bash sandbox tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: allow unprivileged user namespaces for bwrap
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo clippy
        run: cargo clippy $CRATES --all-targets --locked -- -D warnings
      - name: build tests
        run: cargo nextest run --locked --no-run $CRATES
      - name: run tests
        timeout-minutes: 40
        env:
          MHC_REQUIRE_SANDBOX_TEST: "1"
        run: cargo nextest run --locked --no-fail-fast $CRATES
