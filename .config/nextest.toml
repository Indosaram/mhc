# A hung or runaway test is killed and named in the log instead of taking the runner down.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
status-level = "slow"
final-status-level = "slow"

# 2000 seeded three-device runs with a temp dir each: 200-230 s on Linux and Windows runners, so
# the default 300 s kill sits inside its normal spread.
[[profile.default.overrides]]
filter = "package(maho-memory-core) & test(three_device_seeded_capture_model_converges_without_spliced_values)"
slow-timeout = { period = "60s", terminate-after = 10 }

# These drive the real `mhc` binary end to end (a host with session workers, or a print run whose
# kibitzer child turn must deliver a nudge) against fixed per-event bounds. Beside a full shard on
# a 4-core Windows runner the process startups alone outran those bounds, while the same tests
# pass alone every time; they run with the runner to themselves instead of with longer bounds.
[[profile.default.overrides]]
filter = "package(maho-cli) & (test(/^memory_recall_entry::real_mount_/) | test(/^session_runtime_worker::supervisor_stdio_concurrent_/))"
threads-required = "num-test-threads"

# These stage a real packaged release: a ~650 MB `mhc`, its manifest, a gzipped asset and a signed
# update served over HTTP. Each one writes and hashes hundreds of megabytes, so fifteen in parallel
# saturated writeback: most were killed at the 300 s mark and the survivors took minutes. Alone they
# are bounded, and running them one at a time finishes the set in four to six minutes while still
# driving the real end-to-end update path instead of a stand-in.
[[profile.default.overrides]]
filter = "package(maho-cli) & test(/^native_update_/)"
threads-required = "num-test-threads"
