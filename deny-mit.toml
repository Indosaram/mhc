# cargo-deny license policy for the MIT build profile of the `mhc` binary (docs/MIT-PROFILE.md):
#
#   cargo deny --manifest-path crates/maho-cli/Cargo.toml check --config deny-mit.toml licenses
#   cargo deny --manifest-path crates/desktop/senpi-desktop-engine/Cargo.toml check --config deny-mit.toml licenses
#
# Same allowlist as deny.toml, and workspace crates are checked too: `[licenses.private] ignore`
# stays off, so a linked workspace crate without an allowed license fails.

[graph]
targets = []
all-features = false
exclude-dev = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "0BSD",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = false
