[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Third-party deps, pinned to COMP 93b78ac Cargo.lock versions.
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false }
dirs = "=6.0.0"
fancy-regex = "=0.16.2"
filetime = "=0.2.27"
flate2 = "=1.1.8"
futures = "=0.3.34"
gethostname = "=1.1.0"
hex = "=0.4.3"
iana-time-zone = "=0.1.65"
indexmap = "=2.14.0"
jiff = "=0.2.23"
libc = "=0.2.186"
percent-encoding = "=2.3.2"
pretty_assertions = "=1.4.1"
regex = "=1.12.3"
reqwest = { version = "=0.12.28", default-features = false }
serde = "=1.0.228"
serde_json = "=1.0.149"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
sys-locale = "=0.3.2"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = "=1.52.3"
unicode-general-category = "=1.1.0"
unicode-normalization = "=0.1.25"
unicode-width = "=0.2.1"
url = "=2.5.8"
uuid = "=1.20.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
# Thin LTO enables cross-crate optimization with low link-time overhead.
lto = "thin"
# Strip debuginfo to shrink binary size; symbols stay so backtraces keep function names.
strip = "debuginfo"
# Keeps panic file:line information while omitting full debuginfo tables.
debug = "line-tables-only"
# 16 codegen-units is Cargo's default for release builds; stated explicitly
# to document the build-time trade-off: fewer units allow slightly better optimization
# at the cost of slower compilation and increased link memory.
codegen-units = 16

